<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Future Tech | Contacts</title>
  <link href="styles/main.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/imask/7.6.1/imask.min.js"
    integrity="sha512-+3RJc0aLDkj0plGNnrqlTwCCyMmDCV1fSYqXw4m+OczX09Pas5A/U+V3pFwrSyoC1svzDy40Q9RU/85yb/7D2A=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script defer src="scripts/main.js" type="module"></script>
  <link rel="stylesheet" href="styles/_variables.scss" />
</head>

<body>
  <header class="header" data-js-header>


    <div class="header__promo">
      <div class="header__promo-inner container">
        <a class="header__promo-link" href=""><span class="icon icon--yellow-arrow">Subscribe to our Newsletter
            For New
            & latest Blogs and
            Resources</span></a>
      </div>
    </div>
    <div class="header__body">
      <div class="header__body-inner container">
        <a aria-label="Home" class="header__logo logo" href="./index.html" title="Home"><img alt="" class="logo__image"
            height="50" src="images/logo.svg" width="179" /></a>
        <div class="header__overlay" data-js-header-overlay>
          <nav class="header__menu">
            <ul class="header__menu-list">
              <li class="header__menu-item">
                <a class="header__menu-link" href=" ">Home</a>
              </li>
              <li class="header__menu-item">
                <a class="header__menu-link" href="./news.html">News</a>
              </li>
              <li class="header__menu-item">
                <a class="header__menu-link" href="./podcasts.html">Podcasts</a>
              </li>
              <li class="header__menu-item">
                <a class="header__menu-link" href="./resources.html">Resources</a>
              </li>
            </ul>
          </nav>
          <a class="header__contact-us-link button button--accent" href="./contacts.html">Contact Us</a>
        </div>
        <button aria-label="Open menu" class="header__burger-button burger-button visible-mobile" title="Open menu"
          type="button" data-js-header-burger-button>
          <span class="burger-button__line"></span>
          <span class="burger-button__line"></span>
          <span class="burger-button__line"></span>
        </button>
      </div>
    </div>
  </header>


  <div class="container">
    <div class="select field" data-js-select>
      <label 
      class="select__label" 
      for="phoneNumberPrefix"
      id="phone-number-prefix-select-label"
      >
        Phone number prefix
      </label>
      <select 
      class="select__original-control field__control" 
      id="phoneNumberPrefix"
      tabindex="-1"
      data-js-select-original-control
      >
        <option value="+7" selected>+7</option>
        <option value="+1">+1</option>
        <option value="+2">+2</option>
        <option value="+3">+3</option>
      </select>
      <div class="select__body">
        <div 
        class="select__button field__control" 
        tabindex="0"
        role="combobox"
        aria-expanded="false"
        aria-haspopup="listbox"
        aria-controls="phone-number=prefix-select-dropdown"
        aria-labelledby="phone-number-prefix-select-label"
        data-js-select-button
        >
        +7
      </div>
        <div 
        class="select__dropdown is-on-the-left-side"
        role="listbox"
        id="phone-number=prefix-select-dropdown"
        aria-labelledby="phone-number-prefix-select-label"
        >
          <div 
          class="select__option is-selected is-current" 
          role="option"
          aria-selected="true"
          id="phone-number-prefix-select-option-1"
          data-js-select-option
          >
          +7
        </div>
          <div 
          class="select__option" 
          role="option" 
          aria-selected="false" 
          id="phone-number-prefix-select-option-2"
          data-js-select-option
          >
            +1
            
          </div>
          <div 
          class="select__option" 
          role="option" 
          aria-selected="false" 
          id="phone-number-prefix-select-option-3"
          data-js-select-option
          >
            +2
            
          </div>
          <div 
          class="select__option" 
          role="option" 
          aria-selected="false" 
          id="phone-number-prefix-select-option-4"
          data-js-select-option
          >
            +3
            
          </div>
        </div>
      </div>
    </div>
  </div>


</body>

</html>
