<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Future Tech | Home</title>
    <link href="styles/main.css" rel="stylesheet"/>
    <script defer src="scripts/main.js" type="module"></script>
    <link rel='stylesheet' href='styles/_variables.scss'>
</head>
<body>
<header class="header">
    <div class="header__promo">
        <div class="header__promo-inner container">
            <a class="header__promo-link" href=""
            ><span class="icon icon--yellow-arrow"
            >Subscribe to our Newsletter For New & latest Blogs and
              Resources</span
            ></a
            >
        </div>
    </div>
    <div class="header__body">
        <div class="header__body-inner container">
            <a aria-label="Home" class="header__logo logo" href="/" title="Home"
            ><img
                alt=""
                class="logo__image"
                height="50"
                src="images/logo.svg"
                width="179"
            /></a>
            <div class='header__overlay'>
                <nav class="header__menu">
                    <ul class="header__menu-list">
                        <li class="header__menu-item">
                            <a class="header__menu-link is-active"
                               href=" ">Home</a>
                        </li>
                        <li class="header__menu-item">
                            <a class="header__menu-link" href=" ">News</a>
                        </li>
                        <li class="header__menu-item">
                            <a class="header__menu-link" href=" ">Podcasts</a>
                        </li>
                        <li class="header__menu-item">
                            <a class="header__menu-link" href=" ">Resources</a>
                        </li>
                    </ul>
                </nav>
                <a class='header__contact-us-link button button--accent'
                   href=''>Contact
                    Us</a></div>
            <button
                aria-label='Open menu'
                class='header__burger-button burger-button visible-mobile'
                title='Open menu'
                type='button'>
                <span class='burger-button__line'></span>
                <span class='burger-button__line'></span>
                <span class='burger-button__line'></span>
            </button>
        </div>
    </div>
</header>
</body>
</html>
